[cli]
about = "Te obliga a despegarte del computador"
long_about = "Te obliga a despegarte del computador.\n\nLos bloqueos vienen de reglas recurrentes (`rule`), bloqueos inmediatos (`now`), descansos forzados (`break`) y límites diarios por programa (`allowance`). Mientras un bloqueo está activo o a punto de empezar, no se acepta nada que afloje despegate. La salida es `uninstall`, que primero te muestra tus propias razones."
help_flag = "Muestra la ayuda"
version_flag = "Muestra la versión"

[cli.heading]
command = "COMANDO"
usage = "Uso:"
commands = "Comandos"
options = "Opciones"
arguments = "Argumentos"

[cli.status]
about = "Muestra qué está activo, qué viene después y la configuración"

[cli.rule]
about = "Gestiona los bloqueos recurrentes"

[cli.rule.add]
about = "Añade un bloqueo recurrente"

[cli.rule.add.arg]
name = "Un nombre a tu gusto para la regla"
from = "Hora de inicio, HH:MM"
to = "Hora de fin, HH:MM (si es anterior a --from, termina al día siguiente)"
days = "Días en que empieza: all, weekdays, weekends, mon-fri o mon,wed,sat"
lock = "Ocupa toda la pantalla"
apps = "Programa a cerrar (repetible o separado por comas), p. ej. steam.exe"

[cli.rule.list]
about = "Lista las reglas"

[cli.rule.remove]
about = "Elimina una regla (se rechaza si está activa o a punto de empezar)"

[cli.rule.remove.arg]
name = "Nombre de la regla"

[cli.now]
about = "Empieza un bloqueo ahora mismo; no se puede cancelar"

[cli.now.arg]
minutes = "Cuánto dura, p. ej. 45m, 2h, 1h30m"
lock = "Ocupa toda la pantalla"
apps = "Programa a cerrar (repetible o separado por comas), p. ej. steam.exe"

[cli.break]
about = "Descansos forzados tras un rato de uso continuo"

[cli.break.set]
about = "Bloquea la pantalla un rato tras cada tramo de uso"
long_about = "Bloquea la pantalla un rato tras cada tramo de uso.\n\nSolo cuenta el tiempo con teclado o ratón. Levantarte por tu cuenta durante lo que dura el descanso cuenta como haberlo tomado."

[cli.break.set.arg]
every = "Uso permitido entre descansos, p. ej. 50m"
rest = "Duración del descanso, p. ej. 10m"

[cli.break.off]
about = "Desactiva los descansos forzados"

[cli.allowance]
about = "Límites de tiempo diarios para programas concretos"

[cli.allowance.set]
about = "Limita cuánto se puede usar un programa al día"
long_about = "Limita cuánto se puede usar un programa al día.\n\nSolo cuenta el tiempo con la ventana del programa en primer plano. Cuando se agota, el programa se cierra, y se vuelve a cerrar si lo reabres, hasta el día siguiente."

[cli.allowance.set.arg]
app = "Nombre del ejecutable, p. ej. hearthstone.exe"
minutes = "Tiempo al día, p. ej. 60m o 1h30m"

[cli.allowance.remove]
about = "Quita el límite diario de un programa"

[cli.allowance.remove.arg]
app = "Nombre del ejecutable"

[cli.reasons]
about = "El mensaje con tus razones para instalar despegate"

[cli.reasons.set]
about = "Escribe tus razones; sin texto, las lee de la entrada estándar"

[cli.reasons.set.arg]
text = "Tus razones, con tus propias palabras"

[cli.reasons.show]
about = "Muestra tus razones"

[cli.language]
about = "Muestra o elige el idioma"

[cli.language.arg]
code = "Un código de idioma como en o es, o auto para seguir al de Windows"

[cli.set]
about = "Cambia un ajuste"
long_about = "Cambia un ajuste.\n\n  lead-minutes       minutos antes de un bloqueo en los que ya no se puede aflojar nada\n  warn-minutes       minutos antes de un bloqueo en que aparece el aviso\n  emergency-chars    caracteres a teclear en la pantalla de bloqueo para una pausa de emergencia (0 la desactiva)\n  emergency-minutes  duración de la pausa de emergencia"

[cli.set.arg]
key = "lead-minutes, warn-minutes, emergency-chars o emergency-minutes"
value = "El nuevo valor"

[cli.install]
about = "Instala despegate para que arranque con Windows y resista que lo paren"

[cli.uninstall]
about = "Quita despegate, después de leer tus razones"
