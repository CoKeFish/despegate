[cli]
about = "Forces you to step away from the computer"
long_about = "Forces you to step away from the computer.\n\nBlocks come from recurring rules (`rule`), on-the-spot blocks (`now`), forced breaks (`break`) and daily limits per program (`allowance`). While a block is active, or about to start, nothing that loosens despegate is accepted. The way out is `uninstall`, which shows you your own reasons first."
help_flag = "Print help"
version_flag = "Print version"

[cli.heading]
command = "COMMAND"
usage = "Usage:"
commands = "Commands"
options = "Options"
arguments = "Arguments"

[cli.status]
about = "Show what is active, what comes next, and the configuration"

[cli.rule]
about = "Manage recurring blocks"

[cli.rule.add]
about = "Add a recurring block"

[cli.rule.add.arg]
name = "A name of your choice for the rule"
from = "Start time, HH:MM"
to = "End time, HH:MM (earlier than --from means it ends the next day)"
days = "Days it starts on: all, weekdays, weekends, mon-fri, or mon,wed,sat"
lock = "Take over the whole screen"
apps = "Program to close (repeatable or comma-separated), e.g. steam.exe"

[cli.rule.list]
about = "List the rules"

[cli.rule.remove]
about = "Remove a rule (refused while it is active or about to start)"

[cli.rule.remove.arg]
name = "Name of the rule"

[cli.now]
about = "Start a block right now; it cannot be cancelled"

[cli.now.arg]
minutes = "How long, e.g. 45m, 2h, 1h30m"
lock = "Take over the whole screen"
apps = "Program to close (repeatable or comma-separated), e.g. steam.exe"

[cli.break]
about = "Forced breaks after a stretch of continuous use"

[cli.break.set]
about = "Lock the screen for a while after every stretch of use"
long_about = "Lock the screen for a while after every stretch of use.\n\nOnly time at the keyboard or mouse counts. Stepping away on your own for as long as the break lasts counts as taking it."

[cli.break.set.arg]
long = "Length of the long break, e.g. 20m; without it every break is short"
cycles = "Every how many breaks the long one comes (default 4)"
every = "Use allowed between breaks, e.g. 50m"
rest = "Length of the break, e.g. 10m"

[cli.break.off]
about = "Turn forced breaks off"

[cli.allowance]
about = "Daily time limits for individual programs"

[cli.allowance.set]
about = "Limit how long a program may be used per day"
long_about = "Limit how long a program may be used per day.\n\nOnly time with the program's window in front counts. When the time is used up the program is closed, and closed again if reopened, until the next day."

[cli.allowance.set.arg]
app = "Executable name, e.g. hearthstone.exe"
minutes = "Time per day, e.g. 60m or 1h30m"

[cli.allowance.remove]
about = "Remove a program's daily limit"

[cli.allowance.remove.arg]
app = "Executable name"

[cli.reasons]
about = "The message with your reasons for installing despegate"

[cli.reasons.set]
about = "Write your reasons; with no text, reads them from standard input"

[cli.reasons.set.arg]
text = "Your reasons, in your own words"

[cli.reasons.add]
about = "Add a photo or video (jpg, png, gif, webp, mp4, webm)"

[cli.reasons.add.arg]
file = "Path of the file to copy in"

[cli.reasons.remove]
about = "Remove a photo or video by its stored name"

[cli.reasons.remove.arg]
name = "Name as shown by `reasons show`"

[cli.reasons.show]
about = "Print your reasons and the photos and videos that go with them"

[cli.appearance]
about = "Light, dark, or follow Windows"

[cli.appearance.arg]
mode = "system, light or dark"

[cli.language]
about = "Show or choose the language"

[cli.language.arg]
code = "A language code such as en or es, or auto to follow Windows"

[cli.set]
about = "Change a setting"
long_about = "Change a setting.\n\n  lead-minutes       minutes before a block during which nothing can be loosened\n  warn-minutes       minutes before a block when the warning banner appears\n  emergency-chars    characters to type on the lock screen for an emergency pause (0 disables it)\n  emergency-minutes  length of the emergency pause"

[cli.set.arg]
key = "lead-minutes, warn-minutes, emergency-chars or emergency-minutes"
value = "The new value"

[cli.install]
about = "Install despegate so it starts with Windows and resists being stopped"

[cli.ui]
about = "Open the settings window"

[cli.uninstall]
about = "Remove despegate, after reading your reasons"

