<!doctype html>
<html lang="__LANG__" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>despegate</title>
<style>
  /* The logo at full size: the screen gone dark, and on it the sticker with
     its corner coming unstuck. Sized from the width of the phone, so the
     keyboard coming up does not reshuffle it. */
  @font-face { font-family: Gabarito; font-style: normal; font-weight: 400 900; font-display: block; src: url("/fonts/gabarito-latin.woff2") format("woff2"); }
  :root { --screen: #1d1b45; --sticker: #f5b800; --fg: #1d1b45; --title: #1d1b45; --muted: #5e4a30; --rule: #c79500; --field: #ffd24a; --done: #1d1b45; --bad: #a3180f; --on-bad: #fff; color-scheme: light; }
  :root[data-theme="dark"] { --screen: #0b0a1f; --sticker: #1d1b45; --fg: #eeedfb; --title: #f5b800; --muted: #a6a4cb; --rule: #3a3876; --field: #29275c; --done: #f5b800; --bad: #ff9f8c; --on-bad: #1d1b45; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--screen); color: var(--fg); }
  body { font: 500 16px/1.4 Gabarito, system-ui, sans-serif; padding: 4vw; user-select: none; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; touch-action: manipulation; }

  .sticker { --cut: 15vw; position: relative; isolation: isolate; height: 100%; padding: 8vw 6vw 4vw; display: flex; flex-direction: column; }
  .sticker::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 7vw; background: var(--sticker);
    -webkit-mask: linear-gradient(225deg, transparent calc(var(--cut) * 0.7071), #000 calc(var(--cut) * 0.7071 + 1px));
    mask: linear-gradient(225deg, transparent calc(var(--cut) * 0.7071), #000 calc(var(--cut) * 0.7071 + 1px)); }
  .flap { position: absolute; top: 0; right: 0; width: var(--cut); height: var(--cut); fill: var(--sticker);
    transform-origin: 0 100%; transform: translate(calc(var(--cut) * 0.12), calc(var(--cut) * -0.12)) rotate(-12deg);
    animation: peel 800ms cubic-bezier(0.23, 1, 0.32, 1) 300ms backwards; }
  @keyframes peel { from { transform: translate(0, 0) rotate(0deg); } }

  h1 { font-size: 16.5vw; line-height: 0.9; letter-spacing: -0.04em; margin: 0 0 4vw -0.04em; font-weight: 900; color: var(--title); }
  p { margin: 0; }
  #until { font-size: 5.4vw; line-height: 1.2; font-weight: 800; }
  /* On a break: something to do with the time. */
  #idea { margin-top: 5vw; font-size: 6.4vw; line-height: 1.2; font-weight: 800; color: var(--title); text-wrap: balance; }
  #left { font-size: 5.4vw; line-height: 1.2; color: var(--muted); }

  /* The middle gives way: the photo shrinks and long reasons are set smaller. */
  .why { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 4vw; padding: 5vw 0 4vw; }
  #media { position: relative; flex: 1 1 0; min-height: 0; }
  #media:empty { display: none; }
  #media img, #media video { position: absolute; inset: 0; margin: auto; max-width: 94%; max-height: 96%; background: #fff; border: 1.6vw solid #fff; border-radius: 1vw; box-shadow: 0 2vw 5vw rgba(11, 10, 31, 0.3); transform: rotate(var(--tilt, 1.5deg)); animation: arrive 500ms cubic-bezier(0.23, 1, 0.32, 1) backwards; }
  @keyframes arrive { from { opacity: 0; transform: rotate(var(--tilt, 1.5deg)) scale(0.97); } }
  #reasons { --size: 5.6vw; flex: 0 1 auto; min-height: 0; max-height: 100%; overflow: hidden; font-size: calc(var(--size) * var(--shrink, 1)); line-height: 1.3; font-weight: 600; white-space: pre-line; text-wrap: pretty; }
  #media:empty + #reasons { --size: 7vw; }
  #reasons.empty, #media:empty + #reasons.empty { --size: 4.6vw; color: var(--muted); font-weight: 500; }

  /* What is still within reach: a call, and the apps let through. */
  .reach { display: flex; gap: 3vw; overflow-x: auto; padding-bottom: 3vw; scrollbar-width: none; }
  .reach button { flex: none; width: 17vw; display: grid; justify-items: center; gap: 1.2vw; padding: 0; border: 0; background: none; color: var(--fg); font: 600 3.3vw/1.2 Gabarito, system-ui, sans-serif; transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1); }
  .reach button:active { transform: scale(0.94); }
  .reach img, .reach .dial { width: 13vw; height: 13vw; border-radius: 3.4vw; }
  .reach .dial { display: grid; place-items: center; background: var(--fg); }
  .reach .dial svg { width: 6.4vw; height: 6.4vw; fill: var(--sticker); }
  .reach span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* The ways out, kept small: they are there for emergencies, not as an invitation. */
  footer { border-top: 2px solid var(--rule); padding-top: 2.5vw; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 4vw; }
  footer > button { border: 0; background: none; padding: 2vw 0; min-height: 44px; color: var(--muted); font: 600 3.8vw/1.2 Gabarito, system-ui, sans-serif; text-decoration: underline; text-underline-offset: 3px; }
  footer > button[hidden], .panel[hidden] { display: none; }
  .panel { flex: 1 1 100%; padding-bottom: 2vw; }
  .panel p { color: var(--muted); font-size: 3.8vw; margin: 0 0 2vw; }
  #challenge { font: 4vw/1.5 monospace; word-break: break-all; }
  /* Leaving starts by reading why one came. */
  .panel .quote { color: var(--fg); font-weight: 600; white-space: pre-line; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden; }
  #challenge .done { color: var(--done); font-weight: 700; }
  .panel input { width: 100%; min-height: 44px; font: 16px/1.4 monospace; background: var(--field); border: 2px solid transparent; border-radius: 10px; color: var(--done); caret-color: var(--done); outline: none; padding: 8px 12px; }
  .panel input:focus { border-color: var(--done); }
  .panel input.bad { color: var(--bad); border-color: var(--bad); }
  .panel .go { margin-top: 3vw; width: 100%; min-height: 46px; border: 0; border-radius: 12px; background: var(--bad); color: var(--on-bad); font: 700 16px/1 Gabarito, system-ui, sans-serif; }
  #leave-feedback { color: var(--bad); margin: 2vw 0 0; min-height: 1.4em; }
  /* With a panel open the keyboard is up: the reasons step aside to leave it room. */
  .away .why, .away .reach { display: none; }
  .away footer { border-top: 0; margin-top: 2vw; flex: 1 1 0; min-height: 0; overflow-y: auto; align-content: start; }
  .away h1 { font-size: 11vw; margin-bottom: 2vw; }

  @media (prefers-reduced-motion: reduce) {
    .flap { animation: none; }
    @keyframes arrive { from { opacity: 0; } }
  }
</style>
</head>
<body>
<div class="sticker" id="sticker">
  <svg class="flap" viewBox="0 0 86 86" aria-hidden="true"><path d="M8 0H78a8 8 0 0 1 8 8V78a8 8 0 0 1-8 8L0 8A8 8 0 0 1 8 0Z"/></svg>
  <header>
    <h1 id="title"></h1>
    <p id="until"></p>
    <p id="left"></p>
    <p id="idea" hidden></p>
  </header>
  <div class="why">
    <div id="media"></div>
    <p id="reasons"></p>
  </div>
  <div class="reach" id="reach"></div>
  <footer>
    <button type="button" id="emergency-toggle" hidden></button>
    <button type="button" id="leave-toggle"></button>
    <div class="panel" id="emergency" hidden>
      <p id="prompt"></p>
      <p id="challenge"></p>
      <input id="typed" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    </div>
    <div class="panel" id="leave" hidden>
      <p id="leave-about"></p>
      <p class="quote" id="leave-reasons"></p>
      <p id="leave-prompt"></p>
      <input id="leave-phrase" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <p id="leave-feedback" aria-live="polite"></p>
      <button type="button" class="go" id="leave-go"></button>
    </div>
  </footer>
</div>
<script>
  const T = __I18N__;
  const VIEW = __VIEW__;
  const t = (key, vars = {}) => (T[key] ?? key).replace(/\{(\w+)\}/g, (_, name) => vars[name] ?? "");
  const $ = (id) => document.getElementById(id);
  const tell = (message) => window.ipc.postMessage(JSON.stringify(message));

  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  tell({ kind: "theme", dark: true, bar: css("--screen") });

  $("title").textContent = t(VIEW.idea ? "lock.rest_title" : "lock.title");
  if (VIEW.idea) { $("idea").textContent = VIEW.idea; $("idea").hidden = false; }
  const until = new Date(VIEW.until);
  // The time is written the way the phone is set to: with am and pm, or around the clock.
  const hours = until.getHours(), mins = String(until.getMinutes()).padStart(2, "0");
  const at = VIEW.hour12 ? `${hours % 12 || 12}:${mins} ${hours < 12 ? "am" : "pm"}` : `${String(hours).padStart(2, "0")}:${mins}`;
  $("until").textContent = t("lock.until", { until: at });
  function countdown() {
    const seconds = Math.max(0, Math.round((until - Date.now()) / 1000));
    const left = seconds >= 3600
      ? `${Math.floor(seconds / 3600)} h ${String(Math.floor(seconds % 3600 / 60)).padStart(2, "0")} min`
      : `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    $("left").textContent = t("lock.left", { left });
  }
  countdown();
  setInterval(countdown, 1000);

  const reasons = $("reasons");
  if (VIEW.reasons) reasons.textContent = VIEW.reasons;
  else { reasons.textContent = t("lock.no_reasons"); reasons.classList.add("empty"); }
  // Long reasons are set smaller rather than cut off.
  function fit() {
    let shrink = 1;
    reasons.style.removeProperty("--shrink");
    while (reasons.scrollHeight > reasons.clientHeight + 1 && shrink > 0.5) {
      shrink -= 0.05;
      reasons.style.setProperty("--shrink", shrink);
    }
  }

  // Photos and videos take turns: a photo for a while, a video until it ends.
  const media = $("media");
  let index = -1;
  function next() {
    if (!VIEW.media.length) return;
    index = (index + 1) % VIEW.media.length;
    const item = VIEW.media[index];
    media.replaceChildren();
    media.style.setProperty("--tilt", index % 2 ? "-1.2deg" : "1.5deg");
    if (item.kind === "video") {
      const video = document.createElement("video");
      video.src = item.url;
      video.autoplay = true;
      video.playsInline = true;
      video.onended = next;
      video.onerror = () => setTimeout(next, 1000);
      if (VIEW.media.length === 1) video.loop = true;
      media.append(video);
      video.play().catch(() => {});
    } else {
      const img = document.createElement("img");
      img.src = item.url;
      img.onerror = () => setTimeout(next, 1000);
      media.append(img);
      if (VIEW.media.length > 1) setTimeout(next, 8000);
    }
  }
  next();

  // A call is always possible; the allowed apps follow.
  const reach = $("reach");
  function reachable(name, picture, onTap) {
    const b = document.createElement("button");
    b.type = "button";
    const text = document.createElement("span");
    text.textContent = name;
    b.append(picture, text);
    b.onclick = onTap;
    reach.append(b);
  }
  const dial = document.createElement("div");
  dial.className = "dial";
  dial.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
  reachable(t("lock.call"), dial, () => tell({ kind: "call" }));
  for (const app of VIEW.allowed) {
    const img = document.createElement("img");
    img.src = `/icon/${app.pkg}`;
    img.alt = "";
    reachable(app.label, img, () => tell({ kind: "open", pkg: app.pkg }));
  }

  // The two ways out share the bottom of the sticker; opening one closes the other.
  const sticker = $("sticker");
  function toggle(panel, field) {
    const open = panel.hidden;
    for (const other of [$("emergency"), $("leave")]) other.hidden = true;
    panel.hidden = !open;
    sticker.classList.toggle("away", open);
    if (open) field.focus(); else { field.blur(); fit(); }
  }

  if (VIEW.challenge) {
    $("emergency-toggle").hidden = false;
    $("emergency-toggle").textContent = t("lock.emergency_toggle");
    $("prompt").textContent = t("lock.emergency", { minutes: VIEW.emergency_minutes });
    // The part already typed right is marked on the text itself.
    const done = document.createElement("span");
    done.className = "done";
    const rest = document.createTextNode(VIEW.challenge);
    $("challenge").append(done, rest);
    const typed = $("typed");
    $("emergency-toggle").onclick = () => toggle($("emergency"), typed);
    typed.addEventListener("input", () => {
      const value = typed.value.toLowerCase();
      if (value !== typed.value) typed.value = value;
      const right = VIEW.challenge.startsWith(value);
      typed.classList.toggle("bad", !right);
      if (right) { done.textContent = value; rest.textContent = VIEW.challenge.slice(value.length); }
      tell({ kind: "typed", typed: value });
    });
  }

  // Uninstalling is the way out that is always open.
  const pending = new Map();
  let seq = 0;
  window.__reply = (reply) => { const resolve = pending.get(reply.id); pending.delete(reply.id); if (resolve) resolve(reply); };
  $("leave-toggle").textContent = t("lock.uninstall");
  $("leave-about").textContent = `${t("uninstall.about")} ${t(VIEW.reasons ? "uninstall.your_reasons" : "uninstall.no_reasons")}`;
  $("leave-reasons").textContent = VIEW.reasons;
  $("leave-reasons").hidden = !VIEW.reasons;
  $("leave-prompt").textContent = t("uninstall.confirm", { phrase: VIEW.phrase });
  $("leave-go").textContent = t("uninstall.button");
  $("leave-toggle").onclick = () => toggle($("leave"), $("leave-phrase"));
  $("leave-go").onclick = async () => {
    const reply = await new Promise((resolve) => {
      const id = ++seq;
      pending.set(id, resolve);
      tell({ id, kind: "uninstall", phrase: $("leave-phrase").value });
    });
    if (!reply.ok) $("leave-feedback").textContent = reply.text;
  };

  fit();
  window.addEventListener("resize", fit);
</script>
</body>
</html>
